# Статика интерфейса и прокси к API. Заголовки безопасности — те же, что ставит backend:
# только свои ресурсы, окно подтверждения платежа нельзя встроить в чужую страницу.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Сжатие статики интерфейса. application/json в списке нет: ответы API с кодами подтверждения не сжимаются (BREACH).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # разбор поручения локальной моделью на CPU может занимать десятки секунд
        proxy_hide_header Content-Security-Policy;  # заголовки уже ставит этот сервер
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
